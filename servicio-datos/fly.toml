app = 'farmacias-datos'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # La máquina no se apaga: el estado de turnos vive en memoria del
  # proceso y una suspensión lo pierde por completo.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1